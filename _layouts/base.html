<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.descripcion | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/estilo.css' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🧠</text></svg>">
</head>
<body>
<div class="page {{ page.ancho }}">
{{ content }}
<footer>
  <span>Proyecto de innovación docente nº 3165 · Universidad de Sevilla</span>
  <span><a href="{{ site.github_url }}">Repositorio en GitHub</a> · CC BY-SA 4.0</span>
</footer>
</div>
</body>
</html>
