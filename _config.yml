title: "Alfabetización en IA generativa"
description: >-
  Materiales abiertos del proyecto de innovación docente nº 3165 de la Universidad de
  Sevilla: marco común, material base para el aula e instrumentos de valoración.
lang: es
github_url: https://github.com/jorgeBIGS/innovacion-US-3165

# Formularios en línea, idénticos y comunes a toda la red: así todas las respuestas
# quedan en dos hojas que recoge la coordinación, y la pregunta de asignatura y grupo
# permite separarlas. Una asignatura puede usar los suyos con 'formulario_inicial' o
# 'formulario' en sus datos, pero entonces sus respuestas quedan fuera de esas hojas.
#
# El inicial NO se enlaza desde el curso: lo pasa el docente en clase, antes de que el
# alumnado vea ninguna lección. El final sí, como última tarjeta del curso.
formulario_inicial_comun:
formulario_comun: https://forms.cloud.microsoft/e/Dk5YGCDZEs
url: https://jorgebigs.github.io
baseurl: /innovacion-US-3165

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: pagina

exclude:
  - bin/
  # Documentación detallada: vive en el repositorio, no en el sitio. La parte del
  # profesorado se resume en una sola página, /profesorado/.
  - docencia/
  - marco/
  - instrumentos/
  - analisis/
  - LICENSE
  - LICENSE-CODE
  - CITATION.cff
  - README.md
  - .gitignore
