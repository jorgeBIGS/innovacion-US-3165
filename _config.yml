title: "Alfabetización en IA generativa"
description: >-
  Materiales abiertos del proyecto de innovación docente nº 3165 de la Universidad de
  Sevilla: marco común, material base para el aula e instrumentos de valoración.
lang: es
github_url: https://github.com/jorgeBIGS/innovacion-US-3165

# Formulario de autoevaluación común a toda la red. Una asignatura puede usar otro
# definiendo 'formulario' en sus datos.
formulario_comun: https://forms.cloud.microsoft/e/Dk5YGCDZEs
url: https://jorgebigs.github.io
baseurl: /innovacion-US-3165

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: pagina

exclude:
  - bin/
  # Documentación detallada: vive en el repositorio, no en el sitio. La parte del
  # profesorado se resume en una sola página, /profesorado/.
  - docencia/
  - marco/
  - instrumentos/
  - analisis/
  - LICENSE
  - LICENSE-CODE
  - CITATION.cff
  - README.md
  - .gitignore
