title: "Alfabetización en IA generativa"
description: >-
  Materiales abiertos del proyecto de innovación docente nº 3165 de la Universidad de
  Sevilla: marco común, material base para el aula e instrumentos de valoración.
lang: es
github_url: https://github.com/jorgeBIGS/innovacion-US-3165
url: https://jorgebigs.github.io
baseurl: /innovacion-US-3165

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: pagina
  # Las secciones del profesorado se marcan para que su navegación y su cabecera
  # no se confundan con el material del alumnado.
  - scope: { path: "docencia" }
    values: { seccion: profesorado }
  - scope: { path: "marco" }
    values: { seccion: profesorado }
  - scope: { path: "instrumentos" }
    values: { seccion: profesorado }
  - scope: { path: "analisis" }
    values: { seccion: profesorado }

exclude:
  - bin/
  # Origen del consentimiento: se descarga en Word, no se publica como página
  - instrumentos/consentimiento-informado.md
  - LICENSE
  - LICENSE-CODE
  - CITATION.cff
  - README.md
  - .gitignore
